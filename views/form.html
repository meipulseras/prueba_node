<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/form.css?v=2.4">
    <link rel="icon" href="/images/webp/mei_logo_web.webp" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
    <title>Cotizaci&oacute;n</title>
</head>

<body>
  <a class="link links" key="HOME" href="/">Home</a>
  <br>
    <div class="relleno2"></div>
    <div class="formu">
        <form action="/cotizacion" method="post">
            <div class="inputforms">
                <div class="lblinput">
                    <div class="inputlbl">
                        <label class="lang lblform" key="F1" for="name">NOMBRE COMPLETO:</label>
                        <input class="forminput" type="text" id="name" name="name" required><br />
                    </div>
                    <br />
                    <div class="inputlbl">
                        <label class="lang lblform" key="F2" for="rut">RUT:</label>
                        <input class="forminput" type="text" id="rut" name="rut" required><br />
                    </div>
                    <br />
                    <div class="inputlbl">
                        <label class="lang lblform" key="F3" for="direccion">DIRECCIÓN:</label>
                        <input class="forminput" type="text" id="address" name="address" required><br />
                    </div>
                    <br />
                    <div class="inputlbl">
                        <label class="lang lblform" key="F4" for="direccion">COMUNA:</label>
                        <input class="forminput" type="text" id="commune" name="commune" required><br />
                    </div>
                    <br />
                    <div class="inputlbl">
                        <label class="lang lblform" key="F5" for="tel">TELÉFONO:</label>
                        <input class="forminput" type="tel" id="phone" name="phone" required><br />
                    </div>
                    <br />
                    <div class="inputlbl">
                        <label class="lang lblform" key="F6" for="mail">CORREO:</label>
                        <input class="forminput" type="email" id="mail" name="mail" required>
                    </div>

                </div>
            </div>
            <br />
            <br />
            <br />

            <div class="relleno2"></div>

                    <div class="checkboxes">
                        <input type="checkbox" id="foto1" name="product" value="01. Amigas.">
                    </div>
                </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/2image.webp?v=1" alt="Pulseras2">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto2" name="product" value="02. Pulsera para compartir 2.">
                    </div>
                </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/3image.webp?v=1" alt="Pulseras3">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto3" name="product" value="03. Pulseras BFF.">
                    </div>
                </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/4image.webp?v=1" alt="Pulseras4">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto4" name="product" value="04. Pulseras girasol.">
                    </div>
                </div>
            </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/5image.webp?v=1" alt="Pulseras5">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto5" name="product" value="05. Pulseras para compartir1.">
                    </div>
                </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/6image.webp?v=1" alt="Pulseras6">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto6" name="product" value="06. Pulseras estrella.">
                    </div>
                </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/7image.webp?v=1" alt="Pulseras7">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto7" name="product" value="07. Set pulseras.">

                </div>

                        <input type="checkbox" id="foto8" name="product" value="08. Pulseras hilo rojo.">

                </div>
            </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/image9.webp" alt="Pulseras9">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto9" name="product" value="09. Pulseras para compartir 2.">
                    </div>
                </div>
                <div class="products">
                    <img class="fotoform" src="/images/webp/image10.webp" alt="Pulseras10">
                    <div class="checkboxes">
                        <input type="checkbox" id="foto10" name="product" value="10. Pulseras girasol.">
                    </div>
                </div>

                    <img class="fotoform" src="/images/webp/image11.webp" alt="Pulseras11">

                    </div>
                </div>
            </div> 

            <br>
            <br>
            <div class="reference">
                <p class="lang lblform" key="F8">*Imágenes referenciales.</p>
            </div>
            <div class="relleno2"></div>

            <textarea class="commentbox lang" id="comment" name="comment" key="F9">Deja tu comentario.</textarea><br /><br />
            <input class="cotizar pe lang" type="submit" value="Cotizar" id="aceptar">
        </form>
    </div>

 <script src="/js/title.js" type="text/javascript"></script>

</body>

</html>
